name: "🐛 Bug Report"
description: "Report a bug, playback issue, media converter error, or UI glitch in Photos."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve **Photos**! Please fill out the details below so our engineering team can reproduce and resolve the issue quickly.
  - type: input
    id: version
    attributes:
      label: "Photos App Version"
      description: "Which version and channel of Photos are you running?"
      placeholder: "e.g., 1.2.1 Beta / 1.2.1 Stable"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Device & Android Version"
      description: "Your phone/tablet model and Android OS version."
      placeholder: "e.g., Samsung Galaxy S24 Ultra — Android 15"
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: "Affected Area"
      description: "Which module did the issue occur in?"
      options:
        - "Photo Gallery & Full-Screen Viewer"
        - "10-Module Pro Photo Editor"
        - "Cinema Video Player & Picture-in-Picture (PiP)"
        - "Video-to-MP3 / Audio & Multi-Res Video Converter"
        - "Audiophile Music Player & Synced .LRC Lyrics"
        - "10-Band EQ, DSP & FFT/Waterfall Spectrum"
        - "EXIF Inspector & Private PIN Vault"
        - "Other / General UI"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we trigger this behavior?"
      placeholder: |
        1. Open Photos and navigate to...
        2. Tap on...
        3. Observe that...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected vs. Actual Behavior"
      description: "What did you expect to happen, and what actually happened?"
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: "Screenshots, Media Format, or Additional Context (Optional)"
      description: "Attach screenshots, screen recordings, or mention the file format (e.g., 4K 60fps HEVC MP4, 24-bit/96kHz FLAC, DNG RAW)."
